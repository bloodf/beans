# Checks a change to what beans.app serves Devices: the model catalog (crates/models/catalog.json)
# and the marketplace index (crates/cli/marketplace/index.json) each move their "updated" time
# forward whenever anything else in them changes, as Devices keep whichever copy is later. The
# rules each must read by are checked by the beans-models and beans tests in the Tests workflow.
# scripts/check-catalog.ts is the check; `pnpm run check:catalog` runs it locally.
name: Catalog

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CATALOG_BASE_REF: ${{ github.base_ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run sync:models --self-check
      - run: git fetch --depth=1 origin "+refs/heads/$CATALOG_BASE_REF:refs/remotes/origin/$CATALOG_BASE_REF"
      - run: pnpm run check:catalog
        env:
          CATALOG_BASE: origin/${{ env.CATALOG_BASE_REF }}
