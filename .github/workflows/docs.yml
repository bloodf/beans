# Checks the docs on same-repository release/** pull requests targeting main: each architecture doc within its budget,
# every subject listed in ARCHITECTURE.md, and every relative link and #heading resolving.
# scripts/check-docs.ts is the check; `bun run check:docs` runs it locally.
name: Docs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun run check:docs
