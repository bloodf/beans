# Checks the docs only on explicit manual dispatch: each architecture doc within its budget,
# every subject listed in ARCHITECTURE.md, and every relative link and #heading resolving.
# scripts/check-docs.ts is the check; `pnpm run check:docs` runs it locally.
name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:docs
