# Checks the docs on same-repository pull requests targeting main and manual dispatch: each architecture doc within its budget,
# every subject listed in ARCHITECTURE.md, and every relative link and #heading resolving.
# scripts/check-docs.ts is the check; `pnpm run check:docs` runs it locally.
name: Docs

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:docs
