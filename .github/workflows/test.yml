# Runs the full test matrix only on explicit manual dispatch: the Rust workspace on Linux,
# where the relay's store suite runs on SQLite and on a Postgres service, and on macOS; the crates
# a Windows Runner runs, on Windows; the macOS app's XCTest suite over the markdown crate it links;
# the Windows and Linux app's page and Go side on Ubuntu, plus Go-only desktop builds and tests on
# macOS and Windows; and the phone app's TypeScript. Jobs that compile the CLI install a pinned
# protoc first. The end-to-end scripts, which need a live relay, a model, or a simulator, run locally.
name: Tests

on:
  workflow_dispatch:
permissions:
  contents: read

# A newer manual run on the same ref replaces the previous run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release-source:
    name: Release source fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run --config vitest.config.ts scripts/release-eas.test.ts scripts/release-github.test.ts scripts/submit-eas.test.ts scripts/protoc-workflows.test.ts scripts/release-pr-gates.test.ts scripts/release-archive.test.ts

  rust-linux:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: beans
          POSTGRES_DB: beans
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      BEANS_RELAY_TEST_POSTGRES: postgres://postgres:beans@127.0.0.1:5432/beans?sslmode=disable
      # Hosted Linux runners have limited disk. Avoid debug symbols and incremental
      # object copies for CI tests without changing the crates or test coverage.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - run: python3 -I -B scripts/server-updater.test.py -v
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # prost-build, reached through lancedb, runs protoc and does not bundle it.
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: protoc@3.36.2
          fallback: none
      # Cargo unifies features across the packages of one run, and the phone core takes beans
      # without the runner, so it is tested on its own.
      - name: Report disk space before Rust build
        run: df -h .
      - name: Build real relay for revocation fixture
        run: |
          cargo build --locked -p beans-relay --bin beans-relay
          relay="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, pathlib, sys; print(pathlib.Path(json.load(sys.stdin)["target_directory"]) / "debug" / "beans-relay")')"
          test -x "$relay"
          printf 'BEANS_REVOCATION_RELAY_BIN=%s\n' "$relay" >> "$GITHUB_ENV"
      - name: Compile Device library tests without Runner features
        run: cargo test --locked -p beans --no-default-features --lib --no-run
      - run: cargo test --locked --workspace --exclude beans-mobile
      - run: cargo test --locked -p beans-mobile
      - name: Report disk space after Rust tests
        if: always()
        run: df -h .
      # #427: same hang on Linux as macOS — bash_input waited forever on continuous output.
      - name: Stress bash_session hang regression (#427)
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            echo "=== hang regression $i/20 ==="
            cargo test --locked -p beans-agent --lib \
              tools::bash_session::tests::a_background_command_returns_while_it_prints \
              -- --exact --test-threads=1
            cargo test --locked -p beans-agent --lib \
              tools::bash_session::tests::input_returns_while_the_command_keeps_printing \
              -- --exact --test-threads=1
          done

  rust-macos:
    name: Rust (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: protoc@3.36.2
          fallback: none
      - name: Build real relay for revocation fixture
        run: |
          cargo build --locked -p beans-relay --bin beans-relay
          relay="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json, pathlib, sys; print(pathlib.Path(json.load(sys.stdin)["target_directory"]) / "debug" / "beans-relay")')"
          test -x "$relay"
          printf 'BEANS_REVOCATION_RELAY_BIN=%s\n' "$relay" >> "$GITHUB_ENV"
      - run: cargo test --locked --workspace --exclude beans-mobile
      - run: cargo test --locked -p beans-mobile
      # #427: bash_input used to hang forever on a command that keeps printing; prove the
      # bounded return and the background settle path stay green under repetition on macOS
      # (and Linux, same step on rust-linux).
      - name: Stress bash_session hang regression (#427)
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            echo "=== hang regression $i/20 ==="
            cargo test --locked -p beans-agent --lib \
              tools::bash_session::tests::a_background_command_returns_while_it_prints \
              -- --exact --test-threads=1
            cargo test --locked -p beans-agent --lib \
              tools::bash_session::tests::input_returns_while_the_command_keeps_printing \
              -- --exact --test-threads=1
          done

  rust-windows:
    name: Rust (Windows)
    # The crates a Windows Runner runs: the CLI, the agent, the model catalog, and provider
    # sign-in. There paths have drive letters, PATH splits on `;`, and commands run on pipes in
    # Git for Windows' bash, which the runner has; tests of Unix-only behavior (terminal sessions,
    # the login shell's environment) are #[cfg(unix)]. The release builds x86_64-pc-windows-gnu with zig, and the
    # tests build with the runner's MSVC toolchain.
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # rustc ran out of memory (STATUS_STACK_BUFFER_OVERRUN after a failed allocation) compiling
      # the CLI's test targets with the Lance dependencies; one job at a time keeps the peak down.
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: protoc@3.36.2
          fallback: none
      - name: Build real relay for revocation fixture
        shell: pwsh
        run: |
          cargo build --locked -p beans-relay --bin beans-relay
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $metadataJson | ConvertFrom-Json
          $relay = Join-Path $metadata.target_directory 'debug/beans-relay.exe'
          if (-not (Test-Path -LiteralPath $relay -PathType Leaf)) { throw "Built relay executable not found: $relay" }
          $relay = (Resolve-Path -LiteralPath $relay).Path
          "BEANS_REVOCATION_RELAY_BIN=$relay" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      # Every suite runs, so one failing on Windows does not hide the others.
      - run: cargo test --locked --no-fail-fast -p beans -p beans-agent -p beans-models -p beans-provider-auth -p beans-tls

  macos-app:
    name: macOS app
    # The app builds against the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'build-tools;34.0.0 platforms;android-34'
      - name: Expose pinned Android fixture tools
        run: |
          test -x "$JAVA_HOME/bin/java"
          test -x "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/34.0.0/apksigner"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"
      - name: Require native Apple metadata tools
        run: test -x /usr/bin/plutil && command -v zip && command -v unzip
      - name: Verify generated native release metadata and refusals
        run: pnpm exec vitest run --config vitest.config.ts scripts/release-native-identity.test.ts
      # The markdown crate's static library, xcframework, and Swift bindings, as `pnpm run dev`
      # builds them into macos/Libraries and macos/Sources/BeansMarkdown.
      - name: Build the markdown crate for Swift
        run: node --import tsx --input-type=module -e 'import { buildMarkdown } from "./scripts/app.ts"; if (!(await buildMarkdown("debug")).ok) process.exit(1)'
      - run: swift test
        working-directory: macos
      - run: pnpm run test:mac-startup
      - run: sh macos/Tests/run-settings-layout.sh

  desktop:
    name: Windows and Linux app
    # Playwright 1.59.1 has no Chromium build for ubuntu26.04; pin until the pin is raised.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: pnpm install --frozen-lockfile
      # src/mygo.ts, the page's bindings to the Go side, is generated and never committed.
      - run: pnpm run generate
      - run: pnpm run typecheck
      - name: Install Chromium for desktop browser checks
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test
      - run: go test -count=1 ./...

  # Go module of desktop/ on macOS (MyGo host compiles without the Solid page or mygo-cli).
  desktop-go-macos:
    name: Desktop Go (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: go build ./...
      - run: go test -count=1 ./...

  # Go module of desktop/ on Windows (same compile/test surface as desktop-go-macos).
  desktop-go-windows:
    name: Desktop Go (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      - run: go build ./...
      # -v so control-token PASS/FAIL lines are visible in the job log.
      - run: go test -count=1 -v ./...

  mobile:
    name: Phone app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test
