[package]
name = "beans"
description = "Beans CLI: keys, local websocket, agent loop, relay sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "beans"
path = "src/lib.rs"

[[bin]]
name = "beans"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command-line binary: everything.
cli = ["runner", "server", "dep:usage", "dep:tracing-subscriber"]
# Connecting and disconnecting account providers. Devices use this without the agent loop.
provider-auth = ["dep:beans-provider-auth"]
# Running bots: the agent loop, providers, tools. Off for a Device that only takes part.
runner = ["provider-auth", "dep:beans-agent", "dep:open", "dep:rmcp", "dep:mcp_http", "dep:process-wrap", "memory-pgvector", "memory-lance"]
# The local websocket the desktop app connects to.
server = ["dep:axum"]
# Vector/native SDKs are linked only by Runners, never the phone core.
memory-pgvector = ["dep:pgvector", "dep:tokio-postgres", "dep:memory-postgres-rustls", "dep:percent-encoding"]
memory-lance = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:arrow-ipc", "dep:axum"]
embedding-local = ["runner", "dep:ort", "dep:tokenizers"]

[dependencies]
beans-agent = { path = "../agent", optional = true }
beans-models = { path = "../models" }
beans-provider-auth = { path = "../provider-auth", optional = true }
beans-tls = { path = "../tls" }
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, optional = true }
base64.workspace = true
chacha20poly1305.workspace = true
usage = { package = "usage-rs", version = "6", optional = true }
crypto_box.workspace = true
data-encoding.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
futures.workspace = true
hkdf.workspace = true
libc.workspace = true
open = { workspace = true, optional = true }
parking_lot.workspace = true
# A reply's quote of a message reads as plain text.
pulldown-cmark = { version = "0.13", default-features = false }
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid.workspace = true
x25519-dalek.workspace = true
if-addrs = "0.15.0"
# rmcp speaks reqwest 0.13; the rest of the crate is on the workspace's 0.12, so the MCP side has its own client.
mcp_http = { package = "reqwest", version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "system-proxy"], optional = true }
rmcp = { version = "3.4.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "auth", "reqwest"], optional = true }
process-wrap = { version = "10", features = ["tokio1"], optional = true }
pgvector = { version = "=0.4.2", features = ["postgres"], optional = true }
tokio-postgres = { workspace = true, features = ["with-serde_json-1"], optional = true }
memory-postgres-rustls = { package = "tokio-postgres-rustls", version = "=0.14.0", features = ["ring"], optional = true }
percent-encoding = { version = "=2.3.2", optional = true }
lancedb = { version = "=0.40.0", default-features = false, features = ["remote"], optional = true }
# Arrow 60 is newer but ABI-incompatible with the official SDK's Arrow 58.
arrow-array = { version = "=58.4.0", optional = true }
arrow-schema = { version = "=58.4.0", optional = true }
arrow-ipc = { version = "=58.4.0", optional = true }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-27"], optional = true }
# Latest compatible stable API; 1.0 RC removes Tokenizer and padding/truncation.
tokenizers = { version = "=0.22.2", default-features = false, features = ["onig"], optional = true }

[target.'cfg(windows)'.dependencies]
# Native draft paths, parent watches, and the Windows service console need these APIs.
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_UI_Shell"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "=3.27.0"
