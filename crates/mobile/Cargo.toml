[package]
name = "beans-mobile"
description = "Beans's Device core for the phone: the JSON API and events over UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "beans_mobile"
# A static library for iOS, a shared one for Android, and a host dylib the bindings generator reads.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
beans = { path = "../cli", default-features = false, features = ["provider-auth"] }
uniffi = "0.32"
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
beans-markdown = { version = "0.1.0", path = "../markdown" }
